# Optional sign-in for the chat page: Keycloak (who you are) + oauth2-proxy (the browser login).
#
#   docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d --wait
#   open http://127.0.0.1:4180/        (admin-demo and user-demo, passwords from .env)
#
# rag-api is no longer published on the host in this mode: everything goes through the proxy, and rag-api checks the
# token again itself (app/auth.py). To use a company identity provider instead of Keycloak, drop the keycloak service
# and point AUTH_ISSUER, AUTH_JWKS_URL, AUTH_AUDIENCE and the OAUTH2_PROXY_* addresses at it.
# Dev setup: plain HTTP, Keycloak dev mode (its data lives in the container). For real use see SECURITY.md.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://127.0.0.1:8180  # what the browser sees; it becomes the token issuer
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # containers reach it as http://keycloak:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # filled into infra/keycloak/realm-rag.json on import
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?set DEMO_ADMIN_PASSWORD in .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
    volumes:
      - ./infra/keycloak/realm-rag.json:/opt/keycloak/data/import/realm-rag.json:ro
    ports:
      - 127.0.0.1:8180:8080
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n' >&3
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5-alpine
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_CLIENT_ID: rag-web
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECURE: "false"  # plain HTTP on localhost only
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: http://127.0.0.1:4180/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://rag-api:8000
      OAUTH2_PROXY_UPSTREAM_TIMEOUT: 300s  # a CPU model can take minutes to answer
      OAUTH2_PROXY_FLUSH_INTERVAL: 50ms  # keep streamed tokens flowing
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"  # forwards the ID token as a bearer token
      OAUTH2_PROXY_WHITELIST_DOMAINS: 127.0.0.1:8180  # sign-out may return through Keycloak
      # Keycloak's browser address differs from its in-network address, so discovery is off and both are given.
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://127.0.0.1:8180/realms/rag
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: http://127.0.0.1:8180/realms/rag/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/rag/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/rag/protocol/openid-connect/certs
    ports:
      - 127.0.0.1:4180:4180
    depends_on:
      keycloak:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4180/ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

  rag-api:
    ports: !reset []
    environment:
      AUTH_MODE: oidc
      AUTH_ISSUER: http://127.0.0.1:8180/realms/rag
      AUTH_AUDIENCE: rag-web
      AUTH_JWKS_URL: http://keycloak:8080/realms/rag/protocol/openid-connect/certs
      AUTH_ADMIN_ROLE: rag-admins
      AUTH_LOGOUT_URL: /oauth2/sign_out?rd=http%3A%2F%2F127.0.0.1%3A8180%2Frealms%2Frag%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3Drag-web%26post_logout_redirect_uri%3Dhttp%253A%252F%252F127.0.0.1%253A4180%252F
