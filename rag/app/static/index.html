<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'">
<title>Ask the engineering documents</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5b6573; --line: #dfe3e8;
  --accent: #1f5fd1; --accent-text: #ffffff; --user: #e8effc; --cite: #e4ecfb; --flash: #fff1b8; --err: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa5b3; --line: #2a313a;
    --accent: #6ea0ff; --accent-text: #0b1220; --user: #1c2a45; --cite: #23324f; --flash: #4a3f12; --err: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa5b3; --line: #2a313a;
  --accent: #6ea0ff; --accent-text: #0b1220; --user: #1c2a45; --cite: #23324f; --flash: #4a3f12; --err: #ff8a80;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header {
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 12px 16px; display: flex; align-items: center; gap: 12px;
}
header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; flex: 1; min-width: 0; }
header small { display: block; color: var(--muted); font-weight: 400; font-size: .8rem; }
button {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
main { flex: 1; overflow-y: auto; padding: 16px; }
#log { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.empty { color: var(--muted); text-align: center; margin-top: 8vh; }
.empty p { margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chips button { font-size: .9rem; text-align: left; }
.msg { display: flex; flex-direction: column; gap: 6px; }
.msg.user { align-items: flex-end; }
.bubble {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.user .bubble { background: var(--user); border-color: transparent; max-width: 85%; }
.bubble.err { color: var(--err); border-color: var(--err); }
.bubble.err pre { white-space: pre-wrap; margin: 6px 0 0; font: inherit; font-size: .8rem; }
.status { color: var(--muted); font-size: .85rem; }
.cite {
  display: inline-block; min-width: 1.6em; padding: 0 5px; margin: 0 1px; text-align: center;
  background: var(--cite); color: var(--accent); border-radius: 6px; font-size: .85em;
  border: 0; cursor: pointer; line-height: 1.5;
}
.sources { display: flex; flex-direction: column; gap: 6px; }
.sources > summary { color: var(--muted); font-size: .85rem; cursor: pointer; }
.src {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; font-size: .9rem;
}
.src.used { border-left: 3px solid var(--accent); }
.src.flash { background: var(--flash); }
.src b { font-weight: 600; }
.src a { color: var(--accent); }
.src .meta { color: var(--muted); font-size: .8rem; }
.src details { margin-top: 4px; }
.src summary { cursor: pointer; color: var(--muted); font-size: .8rem; }
.src pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; font: inherit; font-size: .85rem; }
.foot { color: var(--muted); font-size: .75rem; }
form {
  background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px;
}
.row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; resize: none; max-height: 30vh; min-height: 42px;
}
.note { max-width: 820px; margin: 6px auto 0; color: var(--muted); font-size: .75rem; }
@media (prefers-reduced-motion: no-preference) { .src { transition: background .4s; } }
</style>
</head>
<body>
<header>
  <h1>Ask the engineering documents<small>Answers cite the numbered sources they were built from</small></h1>
  <button id="theme" type="button" aria-label="Toggle dark mode">Theme</button>
  <button id="new" type="button">New chat</button>
</header>
<main id="main"><div id="log" aria-live="polite"></div></main>
<form id="form">
  <div class="row">
    <textarea id="q" rows="1" maxlength="4000" placeholder="Ask a question" aria-label="Question"></textarea>
    <button id="stop" type="button" hidden>Stop</button>
    <button id="send" class="primary" type="submit">Send</button>
  </div>
  <p class="note">Enter sends, Shift+Enter adds a line. A small local model writes the answers, so check the sources before you rely on one.</p>
</form>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = $("log"), main = $("main"), q = $("q"), send = $("send"), stop = $("stop");
const EXAMPLES = [
  "By NIST convention, what coverage factor k is used to calculate the expanded uncertainty U?",
  "What measures does NIST SP 800-82r3 list for restricting logical access to the OT network?",
  "How many times does the NASA SE engine cycle from Pre-Phase A through Phase D?",
];
let sessionId = null, controller = null;
try { sessionId = localStorage.getItem("rag.session"); } catch (e) {}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
const scrollDown = () => { main.scrollTop = main.scrollHeight; };
const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);

function empty() {
  log.replaceChildren();
  const box = el("div", "empty");
  box.append(el("p", null, "Ask about the indexed NASA and NIST documents (systems engineering, measurement uncertainty, OT security, manufacturing)."));
  const chips = el("div", "chips");
  for (const t of EXAMPLES) {
    const b = el("button", null, t);
    b.type = "button";
    b.onclick = () => { q.value = t; ask(); };
    chips.append(b);
  }
  box.append(chips);
  log.append(box);
}

// Plain text with [n] turned into buttons that jump to source n of the same answer.
function fillAnswer(bubble, text, srcEl) {
  bubble.replaceChildren();
  text.split(/(\[\d+\])/).forEach((part) => {
    const m = /^\[(\d+)\]$/.exec(part);
    if (!m) { if (part) bubble.append(document.createTextNode(part)); return; }
    const b = el("button", "cite", m[1]);
    b.type = "button";
    b.title = "Show source " + m[1];
    b.onclick = () => {
      const t = srcEl.querySelector('[data-n="' + m[1] + '"]');
      if (!t) return;
      srcEl.open = true;
      t.scrollIntoView({ block: "nearest" });
      t.classList.add("flash");
      setTimeout(() => t.classList.remove("flash"), 1200);
    };
    bubble.append(b);
  });
}

function srcCard(s, used) {
  const c = el("div", "src" + (used ? " used" : ""));
  c.dataset.n = s.n;
  const head = el("div");
  head.append(el("b", null, "[" + s.n + "] "));
  const href = safeUrl(s.url);
  if (href) {
    const a = el("a", null, s.title || "source");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    head.append(a);
  } else head.append(document.createTextNode(s.title || "source"));
  c.append(head);
  c.append(el("div", "meta", (s.page != null ? "page " + s.page : "") + (used ? (s.page != null ? ", " : "") + "cited in the answer" : "")));
  if (s.content) {
    const d = el("details");
    d.append(el("summary", null, "Show the retrieved passage"), el("pre", null, s.content));
    c.append(d);
  }
  return c;
}

function fillSources(srcEl, retrieved, citations) {
  srcEl.replaceChildren();
  const used = new Set((citations || []).map((c) => c.n));
  const list = retrieved && retrieved.length ? retrieved : citations || [];
  const live = retrieved && retrieved.length;
  srcEl.append(el("summary", null, !used.size
    ? "No source was cited. Show the " + list.length + " retrieved passages"
    : live ? used.size + " of " + list.length + " sources cited" : "Cited sources (" + used.size + ")"));
  list.forEach((s) => srcEl.append(srcCard(s, used.has(s.n))));
}

function addUser(text) {
  const m = el("div", "msg user");
  m.append(el("div", "bubble", text));
  log.append(m);
}

function addAssistant() {
  const m = el("div", "msg");
  const bubble = el("div", "bubble");
  const status = el("div", "status", "Searching the documents...");
  const srcEl = el("details", "sources");
  srcEl.hidden = true;
  const foot = el("div", "foot");
  m.append(bubble, status, srcEl, foot);
  log.append(m);
  return { bubble, status, srcEl, foot };
}

async function* events(res) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      let name = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) name = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (data) yield [name, JSON.parse(data)];
    }
  }
}

async function ask() {
  const text = q.value.trim();
  if (!text || controller) return;
  if (log.querySelector(".empty")) log.replaceChildren();
  q.value = ""; q.style.height = "";
  addUser(text);
  const a = addAssistant();
  scrollDown();
  controller = new AbortController();
  send.disabled = true; stop.hidden = false;
  let answer = "", retrieved = [];
  try {
    const res = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId || undefined }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error("The server answered " + res.status);
    for await (const [name, d] of events(res)) {
      if (name === "session") {
        sessionId = d.session_id;
        try { localStorage.setItem("rag.session", sessionId); } catch (e) {}
        a.foot.textContent = "trace " + d.trace_id.slice(0, 8);
        a.foot.title = "Full trace id " + d.trace_id + ". Open it in Grafana, Tempo.";
      } else if (name === "sources") {
        retrieved = d;
        a.status.textContent = "Writing the answer from " + d.length + " passages...";
      } else if (name === "token") {
        answer += d.text;
        a.bubble.textContent = answer;
        a.status.hidden = true;
      } else if (name === "done") {
        answer = d.answer;
        fillAnswer(a.bubble, answer, a.srcEl);
        fillSources(a.srcEl, retrieved, d.citations);
        a.srcEl.hidden = false; a.srcEl.open = false;
        const u = d.usage || {};
        if (u.completion_tokens) a.foot.textContent += ", " + u.completion_tokens + " tokens";
      } else if (name === "error") {
        throw new Error(d.detail || "The server reported an error");
      }
      scrollDown();
    }
  } catch (e) {
    a.status.hidden = true;
    if (e.name === "AbortError") {
      a.foot.textContent = "Stopped here. The server may still finish this answer and save it to the chat history.";
    } else {
      if (!answer) a.bubble.hidden = true;
      const err = el("div", "bubble err", "The answer could not be produced.");
      const d = el("details");
      d.append(el("summary", null, "Technical detail"), el("pre", null, e.message));
      err.append(d);
      a.bubble.after(err);
    }
  } finally {
    controller = null; send.disabled = false; stop.hidden = true;
    q.focus(); scrollDown();
  }
}

async function restore() {
  if (!sessionId) return empty();
  try {
    const res = await fetch("/sessions/" + encodeURIComponent(sessionId) + "/messages");
    if (!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    if (!rows.length) return empty();
    for (const r of rows) {
      if (r.role === "user") addUser(r.content);
      else {
        const a = addAssistant();
        a.status.hidden = true;
        const cites = r.citations || [];
        fillAnswer(a.bubble, r.content, a.srcEl);
        if (cites.length) { fillSources(a.srcEl, [], cites); a.srcEl.hidden = false; }
      }
    }
    scrollDown();
  } catch (e) {
    sessionId = null;
    try { localStorage.removeItem("rag.session"); } catch (e2) {}
    empty();
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); ask(); };
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, window.innerHeight * 0.3) + "px"; });
stop.onclick = () => controller && controller.abort();
$("new").onclick = () => {
  if (controller) controller.abort();
  sessionId = null;
  try { localStorage.removeItem("rag.session"); } catch (e) {}
  empty(); q.focus();
};
$("theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
restore();
</script>
</body>
</html>
