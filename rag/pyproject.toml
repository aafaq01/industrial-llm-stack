[project]
name = "rag"
version = "0.1.0"
description = "Haystack RAG API over a public domain engineering corpus"
requires-python = "==3.12.*"
dependencies = [
    "haystack-ai==2.31.0",
    "elasticsearch-haystack==6.4.1",
    "sentence-transformers==5.6.1",
    "torch==2.14.1",
    "pypdf==6.19.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
eval = ["deepeval==4.2.8"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
