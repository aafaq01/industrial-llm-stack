      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnSlow
        exp_alerts: []

  - name: rag-ttft 6h/30m at 6x (0.3), only this pair over
    input_series:
      - series: 'slo:sli_error:ratio_rate6h{slo="rag-ttft"}'
        values: "0.33x10"
      - series: 'slo:sli_error:ratio_rate30m{slo="rag-ttft"}'
        values: "0.33x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnFast
        exp_alerts:
          - exp_labels: { severity: page, slo: rag-ttft }
            exp_annotations: *ttft_fast
      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnSlow
        exp_alerts: []

  - name: rag-ttft 6h/30m at 6x (0.3), long window just below
    input_series:
      - series: 'slo:sli_error:ratio_rate6h{slo="rag-ttft"}'
        values: "0.285x10"
      - series: 'slo:sli_error:ratio_rate30m{slo="rag-ttft"}'
        values: "0.33x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnSlow
        exp_alerts: []

  - name: rag-ttft 6h/30m at 6x (0.3), short window just below
    input_series:
      - series: 'slo:sli_error:ratio_rate6h{slo="rag-ttft"}'
        values: "0.33x10"
      - series: 'slo:sli_error:ratio_rate30m{slo="rag-ttft"}'
        values: "0.285x10"
    alert_rule_test:
