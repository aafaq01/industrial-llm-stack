      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnSlow
        exp_alerts: []

  - name: rag-ttft 1h/5m at 14.4x (0.72), long window just below
    input_series:
      - series: 'slo:sli_error:ratio_rate1h{slo="rag-ttft"}'
        values: "0.684x10"
      - series: 'slo:sli_error:ratio_rate5m{slo="rag-ttft"}'
        values: "0.792x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnSlow
        exp_alerts: []

  - name: rag-ttft 1h/5m at 14.4x (0.72), short window just below
    input_series:
      - series: 'slo:sli_error:ratio_rate1h{slo="rag-ttft"}'
        values: "0.792x10"
      - series: 'slo:sli_error:ratio_rate5m{slo="rag-ttft"}'
        values: "0.684x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: RagTTFTErrorBudgetBurnFast
