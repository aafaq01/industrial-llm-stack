        # le matcher: Prometheus 3.x stores "60.0" as exposed by prometheus_client; "60" is accepted for 2.x text-format scrapes.
        expr: |
          1 - (
            sum(rate(rag_stage_duration_seconds_bucket{job="rag-api",stage="ttft",le=~"60|60.0"}[6h]))
            /
            sum(rate(rag_stage_duration_seconds_count{job="rag-api",stage="ttft"}[6h]))
          )
      - record: slo:sli_error:ratio_rate1d
        labels:
          slo: rag-ttft
        # le matcher: Prometheus 3.x stores "60.0" as exposed by prometheus_client; "60" is accepted for 2.x text-format scrapes.
        expr: |
          1 - (
            sum(rate(rag_stage_duration_seconds_bucket{job="rag-api",stage="ttft",le=~"60|60.0"}[1d]))
            /
            sum(rate(rag_stage_duration_seconds_count{job="rag-api",stage="ttft"}[1d]))
          )
      - record: slo:sli_error:ratio_rate3d
        labels:
          slo: rag-ttft
        # le matcher: Prometheus 3.x stores "60.0" as exposed by prometheus_client; "60" is accepted for 2.x text-format scrapes.
        expr: |
          1 - (
            sum(rate(rag_stage_duration_seconds_bucket{job="rag-api",stage="ttft",le=~"60|60.0"}[3d]))
            /
            sum(rate(rag_stage_duration_seconds_count{job="rag-api",stage="ttft"}[3d]))
          )
      - record: slo:sli_error:ratio_rate30d
        labels:
          slo: rag-ttft
        # le matcher: Prometheus 3.x stores "60.0" as exposed by prometheus_client; "60" is accepted for 2.x text-format scrapes.
        expr: |
          1 - (
