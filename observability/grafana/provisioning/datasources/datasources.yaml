apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Links "trace_id=<32 hex>" in a log line to Tempo. rag-api logs it once per chat (rag/app/main.py run_chat).
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id=([0-9a-f]{32})'
          datasourceUid: tempo
          url: '$${__value.raw}'
