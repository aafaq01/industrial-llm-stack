# kind v0.33.0. Single node: the llama.cpp model PVC is ReadWriteOnce and shared by all replicas.
# Node images v0.27+ already read registry config from /etc/containerd/certs.d (kind-up.sh writes it).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      # Traefik web entrypoint (NodePort) -> http://<name>.localhost:8090 on the host
      - containerPort: 30080
        hostPort: 8090
        listenAddress: 127.0.0.1
